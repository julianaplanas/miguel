<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232a78d6'/><rect x='24' y='48' width='13' height='28' rx='4' fill='white'/><rect x='44' y='32' width='13' height='44' rx='4' fill='white'/><rect x='64' y='20' width='13' height='56' rx='4' fill='white'/></svg>">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('tema');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}
<header class="topbar">
  <div class="brand"><span class="dot"></span> {{ settings.app_name }}</div>
  <nav class="nav">
    <a href="/" class="{{ 'active' if active_page == 'dashboard' }}">Dashboard</a>
    <a href="/archivos" class="{{ 'active' if active_page == 'files' }}">Archivos</a>
    <a href="/chat" class="{{ 'active' if active_page == 'chat' }}">Chat</a>
  </nav>
  <div class="topbar-actions">
    <button type="button" class="btn-icon" id="theme-toggle" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    <form method="post" action="/logout"><button type="submit" class="btn-sm">Salir</button></form>
  </div>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<script>
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var root = document.documentElement;
    var current = root.getAttribute('data-theme');
    if (!current) {
      current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    var next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('tema', next); } catch (e) {}
    document.dispatchEvent(new CustomEvent('tema-cambiado', { detail: next }));
  });
</script>
{% block scripts %}{% endblock %}
{% endblock %}
</body>
</html>
